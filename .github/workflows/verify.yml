name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: ./gradlew clean build
      - name: Verify the packaged CLI
        run: ci/verify-distribution.sh build/distributions/*.zip
      - name: Save the verified CLI distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cli-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
      # SonarQube example. Use a configured project and a reviewed action revision.
      # - name: Analyze Java code and import coverage
      #   uses: SonarSource/sonarqube-scan-action@<reviewed-commit-sha>
      #   env:
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #     SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      #   with:
      #     args: >-
      #       -Dsonar.projectKey=<project-key>
      #       -Dsonar.sources=src/main/java
      #       -Dsonar.java.binaries=build/classes/java/main
      #       -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
      # Mend SCA example. A configured runner would need an authenticated Mend CLI.
      # - name: Report resolved Gradle dependencies to Mend
      #   run: mend dep --update --scope "<application>//<project>"
      - name: Save test reports
        if: "${{ !cancelled() && hashFiles('build/reports/tests/**/index.html') != '' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          path: build/reports/tests/
      - name: Save coverage report
        if: "${{ !cancelled() && hashFiles('build/reports/jacoco/test/html/index.html') != '' }}"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html/

